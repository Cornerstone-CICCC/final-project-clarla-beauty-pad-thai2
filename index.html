<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home</title>
    <link rel="stylesheet" href="css/styles.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Baskervville:ital,wght@0,400..700;1,400..700&display=swap');
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap');
    </style>
</head>

<body>
    <header>
        <nav>
            <div class="left-side">
                <a href="#">Home</a>
                <div class="line"></div>
                <a href="#">My Work</a>
                <div class="line"></div>
                <a href="#">Services</a>
                <div class="line"></div>
                <a href="#">Classes</a>
            </div>

            <img class="header-logo" src="src/home/header-logo.png" alt="header-logo">

            <div class="right-side">
                <a href="#">Beauty Tips</a>
                <div class="line"></div>
                <a href="#">About</a>
                <div class="line"></div>
                <a href="#">Contact</a>
                <div class="line"></div>
                <a href="#"><img src="src/home/instagram-icon.png" alt="instagram"></a>
            </div>

        </nav>

    </header>
    <main>
        <section class="bg-container">
            <img class="bg-photo" src="src/home/background.png" alt="background-photo">
            <div class="bg-content">
                <img src="src/home/CarlaBeauty.png" alt="Carla Beauty">
                <p class="intro">Vancouver's go-to makeup and hairstyle, with a Brazilian twist</p>
                <a class="consultation-btn" href="#">Free Consultation</a>
            </div>
        </section>
        <section class="aboutArtist">
            <div class="about-top">
                <img src="src/home/Professional-portfolio.png" alt="artistPhoto">
                <div class="intro-area">
                    <img src="src/home/pink-logo.png" alt="pink logo">
                    <h2>Professional Makeup & Hairstyle Artist</h2>
                    <p>10+ years creating stunning looks for weddings and special occasions.</p>
                    <a class="aboutMeBtn" href="#">About me</a>
                </div>
            </div>
            <p>Our Brands</p>
            <div class="about-bottom">
                <div class="first-line">
                    <img src="src/home/cosmetic-brand-logo/MAC_Cosmetics_logo.png" alt="mac">
                    <img src="src/home/cosmetic-brand-logo/Lancôme_logo.png" alt="lancome">
                    <img src="src/home/cosmetic-brand-logo/INGLOT_logo.png" alt="inglot">
                    <img src="src/home/cosmetic-brand-logo/Laura Mercier_logo.png" alt="Laura Mercier">
                </div>
                <div class="second-line">
                    <img src="src/home/cosmetic-brand-logo/CharlotteTilbury_logo.png" alt="Charlotte Tilbury">
                    <img src="src/home/cosmetic-brand-logo/tarte_logo.png" alt="tarte">
                    <img src="src/home/cosmetic-brand-logo/ANASTASIA_logo.png" alt="anastasia">
                    <img src="src/home/cosmetic-brand-logo/kryolan_logo.png" alt="kryolan">
                </div>

            </div>

        </section>

    </main>
    <footer>

    </footer>
</body>

</html>
